<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--@PWA_HEAD@-->
<title>SpacedCube: OLL and PLL trainer</title>
<meta name="description" content="Spaced practice for all 57 OLL and 21 PLL cases of the 3x3 cube. Free, works offline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: slim header with tabs; practice = scramble card + progress rail, stacking below 880px. */
  --bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #151920;
  --muted: #5a6271;
  --line: #dadee5;
  --accent: #1d5bd0;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecfb;
  --good: #16824a;
  --good-soft: #e1f3e8;
  --bad: #c2352e;
  --bad-soft: #fbe6e4;
  --sticker-on: #f3c300;
  --sticker-off: #c3c8d0;
  --cube-body: #1b1f27;
  --m0: #d9dde4;
  --m1: #bfe0cb;
  --m2: #7fc69c;
  --m3: #3a9a63;
  --m4: #1b6a42;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 26, 36, .06), 0 4px 16px rgba(20, 26, 36, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1d222a; --ink: #e7eaef; --muted: #99a2b0; --line: #2a3039;
    --accent: #79a3ff; --accent-ink: #0a1222; --accent-soft: #1d2a44;
    --good: #45c17d; --good-soft: #15301f; --bad: #f06c64; --bad-soft: #3a1b19;
    --sticker-on: #f3c300; --sticker-off: #464d59; --cube-body: #090b0e;
    --m0: #2b313b; --m1: #24463a; --m2: #2e7050; --m3: #3fa56c; --m4: #78d9a1;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1d222a; --ink: #e7eaef; --muted: #99a2b0; --line: #2a3039;
  --accent: #79a3ff; --accent-ink: #0a1222; --accent-soft: #1d2a44;
  --good: #45c17d; --good-soft: #15301f; --bad: #f06c64; --bad-soft: #3a1b19;
  --sticker-on: #f3c300; --sticker-off: #464d59; --cube-body: #090b0e;
  --m0: #2b313b; --m1: #24463a; --m2: #2e7050; --m3: #3fa56c; --m4: #78d9a1;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
code, kbd { font-family: var(--font-mono); }

/* Header */
.top {
  position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 1180px; margin: 0 auto;
  padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left));
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; }
.brand h1 {
  font-family: var(--font-display); font-stretch: 112%; font-weight: 800;
  font-size: 20px; letter-spacing: -.01em;
}
.brand small { color: var(--muted); font-size: 12px; display: block; line-height: 1.2; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 7px;
  font-weight: 500; color: var(--muted);
}
.setsw { margin-right: auto; }
.setsw .tab { font-family: var(--font-display); font-stretch: 110%; font-weight: 700; padding: 6px 12px; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sticker-off); }
.sync[data-s="synced"]::before { background: var(--good); }
.sync[data-s="connecting"]::before { background: var(--sticker-on); }
.sync[data-s="offline"]::before { background: var(--bad); }

main {
  max-width: 1180px; margin: 0 auto;
  padding: 20px max(20px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.card h2 { font-family: var(--font-display); font-stretch: 108%; font-size: 16px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
  padding: 8px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
kbd {
  font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor;
  opacity: .7; line-height: 1.5;
}

/* Mastery chip */
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 2px 9px 2px 7px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip.off { color: var(--muted); font-weight: 500; }
.chip.off i { background: transparent; border: 1.5px solid var(--sticker-off); }
.b0 { background: var(--m0); } .b1 { background: var(--m1); } .b2 { background: var(--m2); } .b3 { background: var(--m3); } .b4 { background: var(--m4); }

/* Practice */
.practice { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.trainer { display: grid; gap: 18px; padding: 22px; }
.newflag {
  background: var(--accent-soft); color: var(--ink); border-radius: 9px; padding: 9px 12px; font-size: 14px;
  border-left: 3px solid var(--accent);
}
.scramble {
  margin: 0; font-family: var(--font-mono); font-weight: 500;
  font-size: clamp(22px, 3.4vw, 34px); line-height: 1.5;
  display: flex; flex-wrap: wrap; gap: 2px .75em;
}
.scramble span { min-width: 2ch; }
.hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; }
.answer {
  border: 1.5px dashed var(--line); border-radius: var(--radius); min-height: 150px;
  display: grid; place-items: center; padding: 16px;
}
.answer.open { border-style: solid; background: var(--surface-2); place-items: stretch; }
.reveal {
  border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px;
  display: inline-flex; gap: 10px; align-items: center; padding: 14px 6px;
}
.hintbox { display: grid; gap: 8px; justify-items: center; text-align: center; }
.hintlink { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; display: inline-flex; gap: 8px; align-items: center; text-decoration: underline; text-underline-offset: 2px; }
.hintlink kbd { font-size: 10px; }
.hintask { display: grid; gap: 8px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.case-only { justify-content: center; text-align: left; }
.case-only .info { flex: 0 1 auto; }
.hintbox .alg { justify-self: center; }
.case-show { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.case-show .info { display: grid; gap: 6px; min-width: 0; flex: 1; }
.case-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.case-title b { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 24px; }
.case-title span { color: var(--muted); }
.alg {
  font-family: var(--font-mono); font-size: 17px; font-weight: 500; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; justify-self: start; overflow-wrap: anywhere;
}
.alg-note { font-size: 12px; color: var(--muted); }
.grades { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grade {
  border-radius: 12px; padding: 16px 12px; font-size: 17px; font-weight: 600;
  display: inline-flex; justify-content: center; align-items: center; gap: 10px;
  border: 1.5px solid;
}
.grade.miss { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.grade.hit { background: var(--good); border-color: var(--good); color: #fff; }
:root[data-theme="dark"] .grade.hit { color: #07150d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grade.hit { color: #07150d; } }
.grade:active { transform: translateY(1px); }
.last { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 24px; }
.last .ok { color: var(--good); font-weight: 600; }
.last .ko { color: var(--bad); font-weight: 600; }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

.rail { display: grid; gap: 16px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 14px; }
.stats3 div { display: grid; }
.stats3 b { font-family: var(--font-display); font-stretch: 110%; font-size: 28px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats3 span { font-size: 12px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(19, 1fr); gap: 3px; }
.strip button {
  aspect-ratio: 1; border-radius: 3px; border: 1.5px solid transparent; padding: 0;
  background: transparent; border-color: var(--sticker-off);
}
.strip button.on { border-color: transparent; }
.strip button:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend i.none { border: 1.5px solid var(--sticker-off); }
.nextcase { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.nextcase p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.nextcase b { color: var(--ink); }
.focus { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.focus li button {
  width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  border: 0; background: transparent; padding: 5px 6px; border-radius: 8px; text-align: left;
}
.focus li button:hover { background: var(--surface-2); }
.focus .pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 40px 20px; display: grid; gap: 12px; justify-items: center; }

/* Cases */
.setup {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sticker-on);
  border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; display: grid; gap: 10px;
  box-shadow: var(--shadow);
}
.setup h2 { font-family: var(--font-display); font-stretch: 110%; font-size: 22px; font-weight: 800; }
.setup p { margin: 0; max-width: 68ch; color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.fchip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 500;
}
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sortby { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.sortby select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 8px; }
.gblock { margin-bottom: 26px; }
.ghead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.ghead h3 { font-family: var(--font-display); font-stretch: 110%; font-size: 17px; font-weight: 700; }
.ghead span { color: var(--muted); font-size: 13px; }
.ghead .btn { margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ccard {
  position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  display: flex; align-items: stretch;
}
.ccard.on { border-color: color-mix(in srgb, var(--good) 60%, var(--line)); }
.ccard.sel { border-color: var(--sticker-on); box-shadow: 0 0 0 2px color-mix(in srgb, var(--sticker-on) 45%, transparent); }
.cmain {
  flex: 1; display: flex; gap: 12px; align-items: center; border: 0; background: transparent; padding: 10px 44px 10px 10px;
  text-align: left; border-radius: var(--radius); min-width: 0;
}
.cbody { display: grid; gap: 4px; min-width: 0; }
.ctop { display: flex; align-items: baseline; gap: 8px; }
.cnum { font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 20px; line-height: 1; }
.cnick { font-size: 12px; color: var(--muted); }
.calg { font-family: var(--font-mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.35; }
.cmiss { font-size: 12px; color: var(--bad); font-weight: 500; }
.cfoot { flex-wrap: wrap; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.cinfo {
  position: absolute; bottom: 8px; right: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  border-radius: 7px; font-size: 12px; font-weight: 500; padding: 2px 8px;
}
.ctoggle {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0;
  color: var(--muted);
}
.ctoggle[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.ctoggle svg { width: 14px; height: 14px; }

/* Dialog */
.overlay {
  position: fixed; inset: 0; background: rgba(8, 10, 14, .5); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.dialog {
  background: var(--surface); color: var(--ink); border-radius: 16px; width: min(560px, 100%);
  max-height: calc(100% - 24px); overflow: auto; padding: 22px; position: relative; display: grid; gap: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.dlg-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.dlg-head h2 { font-family: var(--font-display); font-stretch: 112%; font-size: 26px; font-weight: 800; }
.dlg-head h2 span { font-weight: 500; color: var(--muted); font-size: 18px; }
.dlg-head .muted { margin: 2px 0 8px; }
.x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.sec { display: grid; gap: 8px; }
.sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field { display: flex; gap: 8px; }
.field input {
  flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
  font-family: var(--font-mono); font-size: 14px;
}
.msg { margin: 0; font-size: 13px; min-height: 1.2em; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--good); }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; }
.kv b { font-size: 18px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12px; color: var(--muted); }
.hist { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.hist i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.hist i.h1 { background: var(--good); } .hist i.h0 { background: var(--bad); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Options */
.options { display: grid; gap: 16px; max-width: 760px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; }
.opt input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); grid-row: span 2; }
.opt label { font-weight: 500; }
.opt p { margin: 0; color: var(--muted); font-size: 13px; grid-column: 2; }
.opt select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 8px; }
.prose p { margin: 8px 0 0; max-width: 68ch; }
.ladder { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.ladder span { font-family: var(--font-mono); font-size: 12px; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
textarea {
  width: 100%; min-height: 110px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px;
  font-family: var(--font-mono); font-size: 12px; resize: vertical;
}
.field { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.account { margin-bottom: 12px; }
.captcha:empty { display: none; }
.update {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px);
  display: flex; gap: 12px; align-items: center; padding: 10px 12px 10px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); font-size: 14px;
}
.account .row { margin-top: 2px; }
.confirm { background: var(--bad-soft); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }

.progress { display: grid; gap: 16px; }
.progress .toolbar { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { display: grid; gap: 2px; }
.tile span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile b { font-family: var(--font-display); font-stretch: 110%; font-size: 34px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile b em { font-style: normal; font-size: 18px; color: var(--muted); font-weight: 600; }
.tile small { color: var(--muted); font-size: 13px; }
.charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.chartcard .sub { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
.chartwrap { position: relative; }
.chart { display: block; overflow: visible; max-width: 100%; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .tk { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .hl { fill: var(--ink); opacity: .06; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; min-width: 140px; z-index: 2;
}
.tip .tg { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tip .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }
details.card summary { cursor: pointer; font-weight: 500; }
.tablewrap { overflow-x: auto; margin-top: 10px; }
.tablewrap table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tablewrap th, .tablewrap td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tablewrap th:first-child, .tablewrap td:first-child { text-align: left; }
.tablewrap th { color: var(--muted); font-weight: 600; }
@media (max-width: 760px) { .charts2 { grid-template-columns: 1fr; } .tiles { grid-template-columns: 1fr 1fr 1fr; } .tile b { font-size: 26px; } }

.viewer { width: min(720px, 100%); gap: 12px; }
.v-title { font-family: var(--font-display); font-stretch: 110%; font-size: 20px; font-weight: 800; padding-right: 40px; }
.v-stage { height: min(52vh, 420px); min-height: 240px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, var(--surface-2), var(--bg)); display: grid; place-items: center; overflow: hidden; touch-action: none; cursor: grab; }
.v-stage canvas { display: block; }
.v-msg { padding: 20px; text-align: center; }
.v-moves { display: flex; flex-wrap: wrap; gap: 4px 6px; font-family: var(--font-mono); font-size: 17px; font-weight: 500; }
.v-moves span { padding: 2px 6px; border-radius: 6px; min-width: 2.2ch; text-align: center; border: 1.5px solid transparent; }
.v-moves span.auf { color: var(--muted); font-style: italic; }
.v-moves span.done { opacity: .45; }
.v-moves span.now { border-color: var(--accent); background: var(--accent-soft); opacity: 1; }
.v-ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.v-play { min-width: 120px; justify-content: center; }
.v-speed { margin-left: auto; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.v-speed select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 4px 6px; }
.v-open { justify-self: start; }

.dg { display: block; flex: none; }

@media (max-width: 880px) {
  .practice { grid-template-columns: 1fr; }
  .strip { grid-template-columns: repeat(19, 1fr); }
}
@media (max-width: 520px) {
  .top-in { padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); gap: 10px; }
  main { padding: 14px max(14px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }
  .brand small { display: none; }
  .trainer { padding: 16px; }
  .kv { grid-template-columns: repeat(2, 1fr); }
  .tab { padding: 6px 10px; }
  .sync span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .answer.open { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.985); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
