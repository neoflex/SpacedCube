# Tests the app, then builds it with this repository's settings and publishes it to GitHub Pages.
# Pull requests run the tests only.
#
# Deployment settings come from repository variables (Settings > Secrets and variables > Actions >
# Variables), so the code holds nothing specific to one deployment. See README, "Deploying your own copy".
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tools
        run: |
          npm ci
          pip install playwright
          python -m playwright install --with-deps chromium
      # Tests run on a build without deployment settings (sync is mocked where it is tested).
      - name: Build for tests
        run: |
          python3 build.py
      - name: Core tests
        run: |
          node tests/test_core.js | tee core.log && tail -1 core.log | grep -q 'fail 0$'
      - name: Smoke and accessibility test
        run: |
          python3 tests/e2e_smoke.py | tee smoke.log && grep -q '^found: \[\] errors: \[\] a11y: \[\]$' smoke.log
      - name: Keyboard test
        run: |
          python3 tests/e2e_keyboard.py | tee keyboard.log && grep -q '^keyboard: ok$' keyboard.log
      - name: PWA and sync test
        run: |
          python3 tests/e2e_pwa.py | tee pwa.log && grep -q '^pwa: ok$' pwa.log
      - name: Build for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PRIVACY_OPERATOR: ${{ vars.PRIVACY_OPERATOR }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
          PRIVACY_DATA_LOCATION: ${{ vars.PRIVACY_DATA_LOCATION }}
          PRIVACY_EMAIL_PROVIDER: ${{ vars.PRIVACY_EMAIL_PROVIDER }}
          PRIVACY_HOSTING: ${{ vars.PRIVACY_HOSTING }}
        run: |
          python3 build.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
