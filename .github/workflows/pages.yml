# Checks and tests the app, then builds it with this repository's settings and publishes it to
# GitHub Pages. Pull requests (and manual runs on other branches) run the checks and tests only.
#
# Deployment settings come from repository variables (Settings > Secrets and variables > Actions >
# Variables), so the code holds nothing specific to one deployment. See README, "Deploying your own copy".
# Actions are pinned to commits; Dependabot keeps the pins current.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Type check
        run: npx tsc -p .
      - name: Unit tests (including every case and scramble in the simulator)
        run: node --test "tests/unit/*.test.js"

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # The tests build dist/ without deployment settings first; the sync test builds its own copy
      # against a mock server.
      - name: Every screen with axe, keyboard and focus, offline and sync
        run: npx playwright test --project=${{ matrix.browser }}

  build:
    name: Build for deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PRIVACY_OPERATOR: ${{ vars.PRIVACY_OPERATOR }}
          PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
          PRIVACY_DATA_LOCATION: ${{ vars.PRIVACY_DATA_LOCATION }}
          PRIVACY_EMAIL_PROVIDER: ${{ vars.PRIVACY_EMAIL_PROVIDER }}
          PRIVACY_HOSTING: ${{ vars.PRIVACY_HOSTING }}
        run: node build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
