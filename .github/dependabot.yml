# Weekly update pull requests. The CI runs every test on them before anything is merged.
version: 2
updates:
  - package-ecosystem: npm          # build, check and test tools (Playwright, axe-core, eslint, typescript)
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ['*']
  - package-ecosystem: github-actions   # keeps the commit pins in the workflows current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
