# Weekly update pull requests. The CI runs every test on them before anything is merged.
version: 2
updates:
  - package-ecosystem: npm          # test and check tools only (axe-core, eslint, typescript)
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ['*']
  - package-ecosystem: github-actions   # keeps the commit pins in the workflows current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip          # Playwright for the browser tests
    directory: /tests
    schedule:
      interval: weekly
